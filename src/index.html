<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap w/ Webpack</title>
  </head>

  <body>
    <div class="container py-4 px-3 mx-auto">
      <h1>Hello, Bootstrap and Webpack!</h1>
      <button class="btn btn-primary">Primary button</button>
      <div class="d-flex gap-4 flex-wrap fs-1 mt-4 mb-5">
        <div class="px-4 py-3 bg-light rounded-2">
          <i class="bi bi-boombox text-primary"></i>
        </div>
        <div class="px-4 py-3 bg-light rounded-2">
          <i class="bi bi-twitter text-info"></i>
        </div>
        <div class="px-4 py-3 bg-light rounded-2">
          <i class="bi bi-emoji-laughing text-warning"></i>
        </div>
        <div class="px-4 py-3 bg-light rounded-2">
          <i class="bi bi-inboxes-fill text-success"></i>
        </div>
        <div class="px-4 py-3 bg-light rounded-2">
          <i class="bi bi-balloon-fill text-danger"></i>
        </div>
        <div class="px-4 py-3 bg-light rounded-2">
          <i class="bi bi-cup-hot-fill text-muted"></i>
        </div>
        <div class="px-4 py-3 bg-light rounded-2">
          <i class="bi bi-device-ssd-fill"></i>
        </div>
        <div class="px-4 py-3 bg-light rounded-2">
          <i class="bi bi-easel2-fill"></i>
        </div>
        <div class="px-4 py-3 bg-light rounded-2">
          <i class="bi bi-filetype-doc"></i>
        </div>
        <div class="px-4 py-3 bg-light rounded-2">
          <i class="bi bi-car-front-fill"></i>
        </div>
        <div class="px-4 py-3 bg-light rounded-2">
          <i class="bi bi-person-circle"></i>
        </div>
      </div>
    </div>
  </body>
</html>
